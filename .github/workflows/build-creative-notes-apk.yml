name: Build Creative Notes APK
on:
  push:
    branches: [creative-notes-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Restore Android project
        run: |
          base64 -d creative-notes-android.tar.gz.b64 | tar xz
      - name: Install Android SDK components
        working-directory: android-native
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: android-native
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        working-directory: android-native
        run: cp app/build/outputs/apk/debug/app-debug.apk Creative-Notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Creative-Notes-APK
          path: android-native/Creative-Notes.apk
          if-no-files-found: error
